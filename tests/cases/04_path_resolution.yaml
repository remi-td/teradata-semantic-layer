category: Path resolution
description: >
  BFS multi-hop resolution. Before F4, the caller had to name every
  intermediate dataset. After F4, the compiler auto-adds shortest-path
  intermediates. Also covers the ambiguous-path pick between a direct and
  an indirect edge.

cases:
  - id: P01
    title: Auto-intermediates — revenue by region with NO intermediates named
    category: BFS
    request:
      model: tpch_orders
      metrics: revenue
      dimensions: region.r_name
    expected_sql: |
      SELECT region.r_name,
             SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
        FROM demo_user.lineitem AS lineitem
        JOIN demo_user.orders   AS orders   ON lineitem.l_orderkey = orders.o_orderkey
        JOIN demo_user.customer AS customer ON orders.o_custkey = customer.c_custkey
        JOIN demo_user.nation   AS nation   ON customer.c_nationkey = nation.n_nationkey
        JOIN demo_user.region   AS region   ON nation.n_regionkey = region.r_regionkey
       GROUP BY region.r_name
    expected: PASS
    notes: 'Before F4 this returned "Could not resolve join path for datasets: region".'

  - id: P02
    title: Ambiguous path — revenue by supplier direct, NOT via partsupp
    category: Ambiguous path
    request:
      model: tpch_orders
      metrics: revenue
      dimensions: supplier.s_name
    expected_sql: |
      SELECT supplier.s_name,
             SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
        FROM demo_user.lineitem AS lineitem
        JOIN demo_user.supplier AS supplier ON lineitem.l_suppkey = supplier.s_suppkey
       GROUP BY supplier.s_name
    expected: PASS
    notes: >
      lineitem has TWO paths to supplier — direct (l_suppkey) and via partsupp
      (l_partkey + l_suppkey → partsupp → supplier). The compiler should pick
      the direct MANY_TO_ONE edge. Taking the partsupp path would inflate
      revenue by the partsupp fan-out.
